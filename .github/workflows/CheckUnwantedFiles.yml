name: CheckUnwantedFiles

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  UNWANTED_NAME_PATTERNS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip *.7z *.rar imgui.ini desktop.ini dxcompiler.dll dxil.dll"
  UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump Dumps"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: ローカル専用フォルダーの除外を確認
        run: python3 .github/check_local_content.py

      - name: Git管理に残った除外対象を確認
        run: |
          TRACKED_IGNORED=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$TRACKED_IGNORED" ]; then
            echo "::error::.gitignoreの除外対象がGit管理に残っています。"
            printf '%s\n' "$TRACKED_IGNORED"
            echo "ローカルに残すファイルはgit rm --cachedで管理対象から外してください。"
            exit 1
          fi
      
      - name: Git管理中の不要なファイルとディレクトリを検索(bash)
        run: |
          # Inspect repository content, not untracked output from checks above.
          UNWANTED_LIST=$(
            shopt -s nocasematch
            set -f # Keep configured globs intact when local files match them.
            while IFS= read -r -d '' file; do
              unwanted=false
              filename=${file##*/}
              for pattern in $UNWANTED_NAME_PATTERNS; do
                if [[ "$filename" == $pattern ]]; then unwanted=true; break; fi
              done
              if [[ "$file" == */* ]]; then
                IFS=/ read -ra directories <<< "${file%/*}"
                for directory in "${directories[@]}"; do
                  for pattern in $UNWANTED_DIR_PATTERNS; do
                    if [[ "$directory" == $pattern ]]; then unwanted=true; break; fi
                  done
                done
              fi
              if $unwanted; then printf '%s\n' "$file"; fi
            done < <(git ls-files -z)
          )
          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error::Git管理中の不要なファイルまたはディレクトリが見つかりました。"
            printf '%s\n' "$UNWANTED_LIST"
            exit 1
          fi
          echo "リポジトリはクリーンです。"
